[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-ai-platform"
version = "1.0.0"
description = "AI-Powered QA Automation Agent Platform"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "QA AI Team", email = "qa-ai@example.com"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-docx>=0.8.11",
    "openai>=1.10.0",
    "google-generativeai>=0.3.1",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "loguru>=0.7.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.uv]
# UV configuration for faster dependency resolution
required-version = ">=0.1.0"
