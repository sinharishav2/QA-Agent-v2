<svg xmlns="http://www.w3.org/2000/svg" width="950" height="200" viewBox="0 0 950 200" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Traceability Chain</text>
  
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="120" height="60" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="90" y="108" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#1e293b">Requirements</text>
    <text x="90" y="126" text-anchor="middle" font-size="10" fill="#475569">@req-001</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="210" y="80" width="120" height="60" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="270" y="108" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#1e293b">Test Cases</text>
    <text x="270" y="126" text-anchor="middle" font-size="10" fill="#475569">TC-001</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="390" y="80" width="120" height="60" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="450" y="108" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#1e293b">Feature File</text>
    <text x="450" y="126" text-anchor="middle" font-size="10" fill="#475569">@req-001 tag</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="570" y="80" width="120" height="60" rx="6" fill="#fce7f3" stroke="#db2777"/>
    <text x="630" y="108" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#1e293b">Step Definition</text>
    <text x="630" y="126" text-anchor="middle" font-size="10" fill="#475569">method implementation</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="750" y="80" width="120" height="60" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="810" y="108" text-anchor="middle" dominant-baseline="middle" font-weight="600" fill="#1e293b">Page Object</text>
    <text x="810" y="126" text-anchor="middle" font-size="10" fill="#475569">locator + action</text>
  </g>
  
  <line x1="150" y1="110" x2="210" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="110" x2="390" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="110" x2="570" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="110" x2="750" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <text x="180" y="105" text-anchor="middle" font-size="9" fill="#475569">maps to</text>
  <text x="360" y="105" text-anchor="middle" font-size="9" fill="#475569">generates</text>
  <text x="540" y="105" text-anchor="middle" font-size="9" fill="#475569">implements</text>
  <text x="720" y="105" text-anchor="middle" font-size="9" fill="#475569">calls</text>
